<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Events</title>
    <link rel="stylesheet" href="../StudentHub-css.css">
    <link rel="stylesheet" href="../interactive-features.css">
    <link rel="stylesheet" href="../events-page.css">
</head>
<body>
<header>
    <h1>StudentHub</h1>
    <nav aria-label="Main Navigation">
        <a href="../index.html">Home</a>
        <a href="AboutUs.html">About</a>
        <a href="Login.html">Login</a>
        <a href="events.html">Events</a>
        <a href="Profile.html">Profile</a>
        <a href="Contact.html">Contact</a>
        <a href="Register.html">Register</a>
        <a href="Faq.html">FAQ</a>
        <a href="Feedback.html">Feedback</a>
        <a href="Admin-Dashboard.html">Admin</a>
    </nav>
</header>

<main class="container">
    <h2 class="page-title">Campus Events</h2>
    <p class="page-sub">Pick an event and register in seconds.</p>

    <!-- Highlights slider: slides are generated from the next upcoming events -->
    <div class="slider">
        <div class="slider-track" id="sliderTrack"></div>
        <button type="button" class="slider-prev" aria-label="Previous slide">&#8249;</button>
        <button type="button" class="slider-next" aria-label="Next slide">&#8250;</button>
        <div class="slider-dots"></div>
    </div>

    <!-- Search + filter by event type -->
    <div class="event-toolbar">
        <input type="search" id="eventSearch" class="event-search" placeholder="🔍 Search events...">
        <div class="chips" id="eventChips"></div>
    </div>

    <!-- Event cards are generated here by StudentHub-js.js -->
    <div class="event-grid" id="eventGrid"></div>
</main>

<!-- Event registration popup (uses the same modal styles as Practical 4) -->
<div class="modal-overlay" id="regOverlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="regTitle">
        <button type="button" class="modal-close" aria-label="Close">&times;</button>
        <h2 id="regTitle">Register for Event</h2>
        <p class="reg-summary" id="regSummary"></p>
        <form id="regForm" action="Event.php" method="post">
            <label for="regName">Your Name</label>
            <input type="text" id="regName" name="Student_Name" placeholder="Enter your name" required>

            <label for="regEmail">Your Email</label>
            <input type="email" id="regEmail" name="Student_Email" placeholder="Enter your email" required>

            <!-- Filled in by JavaScript from the clicked event -->
            <input type="hidden" name="Event_ID">
            <input type="hidden" name="Event_Name">
            <input type="hidden" name="Event_Date">
            <input type="hidden" name="Event_Venue">
            <input type="hidden" name="Event_Type">
            <input type="hidden" name="Event_coordinator">

            <button type="submit">Confirm Registration</button>
        </form>
    </div>
</div>

<footer><p>&copy; 2026 StudentHub</p></footer>
<script src="StudentHub-js.js" defer></script>
</body>
</html>
