<main class="container">
<form action="login.php" method="post">
    <div id="regAlert" style="display:none; background:#dcfce7; color:#15803d; padding:10px; border-radius:6px; font-size:14px; text-align:center; margin-bottom:15px; font-weight:600;">
        Registration successful! Please login below.
    </div>
    <h2>Student Login</h2>

    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>

    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>

    <label for="role">Login As</label>
    <select id="role" name="role" required>
        <option value="">Select Role</option>
        <option value="student">Student</option>
        <option value="faculty">Faculty</option>
        <option value="admin">Admin</option>
    </select>

    <button type="submit" class="btn">Login</button>
    <p>Don't have an account? <a href="Register.html">Register Here</a></p>
</form>
</main>

<footer>
<p>&copy; 2026 StudentHub</p>
</footer>
    <script src="StudentHub-js.js" defer></script>
    <script>
      // Display registration success message if redirected from register.php
      if (window.location.search.includes('registered=1')) {
          const el = document.getElementById('regAlert');
          if (el) el.style.display = 'block';
      }
    </script>
</body>
