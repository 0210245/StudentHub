<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register For Events</title>
    <link rel="stylesheet" href="../StudentHub-css.css">
</head>

<body>
<header>
    <h1>StudentHub</h1>
</header>
    <nav aria-label="Main Navigation">
        <a href="index.html">Home</a>
        <a href="AboutUs.html">About</a>
        <a href="Login.html">Login</a>
        <a href="events.html">Events</a>
        <a href="Profile.html">Profile</a>
        <a href="Contact.html">Contact</a>
        <a href="Register.html" class="active" aria-current="page">Register</a>
        <a href="Faq.html">FAQ</a>
        <a href="Feedback.html">Feedback</a>
    </nav>
<main class="Register">
    <form>
        <h2>Register For Event</h2>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="event">Select Event</label>
        <select id="event" name="event">
            <option value="">Select an event</option>
            <option value="tech">Technical Event</option>
            <option value="cultural">Cultural Event</option>
            <option value="sports">Sports Event</option>
            <option value="workshop">Workshop</option>
        </select>
        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID">
        <button type="submit">Register</button>
    </form>
</main>
</body>
</html>
