</head>

<body>
<header>
    <h1>StudentHub</h1>
    <nav aria-label="Main Navigation">
    <a href="../index.html">Home</a>

</nav>
</header>
<main class="Register">
    <main class="container Register">
    <form action="register.php" method="post">
        <h2>Create Your Account</h2>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="full_name" placeholder="Enter your full name" required>

        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="email" placeholder="Enter your email" required>

        <label for="regRole">Register As</label>
        <select id="regRole" name="role" required>
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
        </select>

        <label for="userId">Student / Faculty ID</label>
        <input type="text" id="userId" name="user_id" placeholder="Enter your ID" required>

        <label for="regDept">Department</label>
        <input type="text" id="regDept" name="department" placeholder="e.g. Computer Engineering" required>

        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password" placeholder="At least 8 characters" minlength="8" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter your password" required>

        <button type="submit">Register</button>
        <p>Already have an account? <a href="Login.html">Login here</a></p>
    </form>
</main>
</main>
<script src="../StudentHub-js.js" defer></script>
</body>
</html>
