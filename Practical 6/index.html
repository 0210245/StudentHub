<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 6 | Fetch API Dynamic Rendering, Search & Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header-box">
      <div>
        <h1>CHARUSAT StudentHub Portal</h1>
        <p>Practical 6: Rendering External JSON Data using Fetch API, Search, Filter, Sort & Pagination</p>
      </div>
      <div>
        <span class="badge-tag">ITUE203 - WDF</span>
      </div>
    </header>

    <!-- Tabs Navigation -->
    <nav class="nav-tabs" aria-label="Dataset navigation">
      <button class="tab-btn active" data-tab="events">🎉 Campus Events (16)</button>
      <button class="tab-btn" data-tab="students">🎓 Student Profiles (20)</button>
      <button class="tab-btn" data-tab="faqs">❓ Portal FAQs (15)</button>
    </nav>

    <!-- Controls Toolbar (Search, Filter, Sort, Pagination Size) -->
    <section class="toolbar-card" aria-label="Filters and search">
      <div class="controls-grid">
        <!-- Search -->
        <div class="input-group" style="grid-column: span 1;">
          <label for="searchInput">Search Data</label>
          <input type="search" id="searchInput" placeholder="Search events..." autocomplete="off">
        </div>

        <!-- Primary Filter -->
        <div class="input-group">
          <label for="primaryFilter" id="primaryFilterLabel">Category Filter</label>
          <select id="primaryFilter">
            <option value="all">All Categories</option>
          </select>
        </div>

        <!-- Dependent Sub-Filter (Intermediate Extension) -->
        <div class="input-group" id="subFilterGroup">
          <label for="subFilter" id="subFilterLabel">Department Filter</label>
          <select id="subFilter">
            <option value="all">All Sub-Categories</option>
          </select>
        </div>

        <!-- Sort Select -->
        <div class="input-group">
          <label for="sortSelect">Sort By</label>
          <select id="sortSelect">
            <option value="default">Default Order</option>
            <option value="name_asc">Name / Title (A &rarr; Z)</option>
            <option value="name_desc">Name / Title (Z &rarr; A)</option>
            <option value="date_asc">Date (Earliest First)</option>
            <option value="date_desc">Date (Latest First)</option>
            <option value="gpa_desc">Highest GPA (Students)</option>
          </select>
        </div>
      </div>

      <!-- Status Bar with Offline Cache Indicator & Refresh -->
      <div class="status-bar">
        <div id="resultCount">Loading records...</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div id="cacheStatus"></div>
          <button type="button" class="btn-secondary" id="refreshBtn" title="Clear LocalStorage Cache and re-fetch fresh JSON">
            ↻ Reload & Bust Cache
          </button>
        </div>
      </div>
    </section>

    <!-- Main Dynamic Content Container -->
    <main id="contentContainer" aria-live="polite">
      <!-- Dynamic cards or accordion injected via app.js -->
    </main>

    <!-- Pagination Controls -->
    <nav class="pagination-wrap" id="paginationContainer" aria-label="Page navigation"></nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
